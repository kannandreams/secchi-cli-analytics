[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secchi-analytics"
version = "0.1.0"
description = "Privacy-safe local CLI analytics for Click and Typer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Secchi contributors" }]
dependencies = [
  "click>=8.1",
  "tomli>=2; python_version < '3.11'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/secchi_analytics"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (check)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      # clippy is deliberately not a commit hook: the bundled DuckDB build
      # makes it too slow for one. It runs in CI and in the self-review skill.
      - id: branch-name
        name: Validate branch name
        entry: scripts/check-branch-name.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false

[package]
name = "secchi-analytics-core"
description = "Event model, redaction, spool capture, and local store for Secchi CLI Analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# The DuckDB-backed store is feature-gated so that the shim path (what CLI
# authors link into their binaries) never compiles or links DuckDB.
store = ["dep:duckdb"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
thiserror.workspace = true
toml.workspace = true
duckdb = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[workspace]
resolver = "2"
members = ["core", "daemon", "shims/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kannandreams/secchi-cli-analytics"
rust-version = "1.85"

[workspace.dependencies]
secchi-analytics-core = { path = "core", version = "0.1.0", default-features = false }
secchi-analytics-clap = { path = "shims/rust", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "v4", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
toml = "0.9"
duckdb = { version = "1", features = ["bundled"] }
tempfile = "3"
assert_cmd = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight this codebase rather than improve it.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
strip = true
